<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow" x1="400" y1="200" x2="400" y2="550" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Stars/dots background -->
  <circle cx="100" cy="80" r="2" fill="#6366f1" opacity="0.6"/>
  <circle cx="250" cy="50" r="1.5" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="600" cy="100" r="2" fill="#6366f1" opacity="0.4"/>
  <circle cx="720" cy="60" r="1.5" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="680" cy="150" r="1" fill="#a78bfa" opacity="0.5"/>
  <circle cx="50" cy="200" r="1.5" fill="#6366f1" opacity="0.4"/>
  <circle cx="750" cy="250" r="1" fill="#8b5cf6" opacity="0.5"/>

  <!-- Ground / street -->
  <ellipse cx="400" cy="540" rx="340" ry="30" fill="#0f172a" opacity="0.6"/>
  <rect x="60" y="530" width="680" height="12" rx="6" fill="#1e293b"/>

  <!-- Glow beneath building -->
  <ellipse cx="400" cy="532" rx="200" ry="20" fill="#6366f1" opacity="0.15"/>

  <!-- Main Building (hostel/PG block) -->
  <!-- Building body -->
  <rect x="210" y="180" width="380" height="350" rx="4" fill="#e2e8f0" filter="url(#shadow)"/>
  <!-- Building face shade -->
  <rect x="210" y="180" width="380" height="350" rx="4" fill="url(#buildingGrad)" opacity="0.9"/>

  <!-- Rooftop railing -->
  <rect x="200" y="168" width="400" height="18" rx="4" fill="#cbd5e1"/>
  <rect x="205" y="158" width="12" height="18" rx="2" fill="#94a3b8"/>
  <rect x="230" y="158" width="12" height="18" rx="2" fill="#94a3b8"/>
  <rect x="255" y="158" width="12" height="18" rx="2" fill="#94a3b8"/>
  <rect x="510" y="158" width="12" height="18" rx="2" fill="#94a3b8"/>
  <rect x="535" y="158" width="12" height="18" rx="2" fill="#94a3b8"/>
  <rect x="560" y="158" width="12" height="18" rx="2" fill="#94a3b8"/>

  <!-- Floor dividers -->
  <rect x="210" y="265" width="380" height="6" rx="2" fill="#94a3b8" opacity="0.5"/>
  <rect x="210" y="350" width="380" height="6" rx="2" fill="#94a3b8" opacity="0.5"/>
  <rect x="210" y="435" width="380" height="6" rx="2" fill="#94a3b8" opacity="0.5"/>

  <!-- Floor 3 windows (top) -->
  <rect x="240" y="200" width="50" height="55" rx="4" fill="#6366f1" opacity="0.85"/>
  <rect x="243" y="203" width="22" height="49" rx="2" fill="#818cf8" opacity="0.7"/>
  <rect x="310" y="200" width="50" height="55" rx="4" fill="#1e293b"/>
  <line x1="335" y1="200" x2="335" y2="255" stroke="#334155" stroke-width="1.5"/>
  <line x1="310" y1="228" x2="360" y2="228" stroke="#334155" stroke-width="1.5"/>
  <rect x="380" y="200" width="50" height="55" rx="4" fill="#6366f1" opacity="0.7"/>
  <rect x="383" y="203" width="22" height="49" rx="2" fill="#818cf8" opacity="0.6"/>
  <rect x="450" y="200" width="50" height="55" rx="4" fill="#1e293b"/>
  <line x1="475" y1="200" x2="475" y2="255" stroke="#334155" stroke-width="1.5"/>
  <line x1="450" y1="228" x2="500" y2="228" stroke="#334155" stroke-width="1.5"/>

  <!-- Floor 2 windows -->
  <rect x="240" y="285" width="50" height="55" rx="4" fill="#1e293b"/>
  <line x1="265" y1="285" x2="265" y2="340" stroke="#334155" stroke-width="1.5"/>
  <line x1="240" y1="313" x2="290" y2="313" stroke="#334155" stroke-width="1.5"/>
  <rect x="310" y="285" width="50" height="55" rx="4" fill="#6366f1" opacity="0.9"/>
  <rect x="313" y="288" width="22" height="49" rx="2" fill="#a5b4fc" opacity="0.7"/>
  <!-- Warm glow window -->
  <rect x="380" y="285" width="50" height="55" rx="4" fill="#f59e0b" opacity="0.8"/>
  <rect x="383" y="288" width="44" height="49" rx="2" fill="#fbbf24" opacity="0.5"/>
  <rect x="450" y="285" width="50" height="55" rx="4" fill="#6366f1" opacity="0.85"/>
  <rect x="453" y="288" width="22" height="49" rx="2" fill="#818cf8" opacity="0.7"/>

  <!-- Floor 1 windows -->
  <rect x="240" y="370" width="50" height="55" rx="4" fill="#6366f1" opacity="0.8"/>
  <rect x="243" y="373" width="22" height="49" rx="2" fill="#818cf8" opacity="0.6"/>
  <rect x="310" y="370" width="50" height="55" rx="4" fill="#1e293b"/>
  <line x1="335" y1="370" x2="335" y2="425" stroke="#334155" stroke-width="1.5"/>
  <line x1="310" y1="398" x2="360" y2="398" stroke="#334155" stroke-width="1.5"/>
  <rect x="380" y="370" width="50" height="55" rx="4" fill="#1e293b"/>
  <line x1="405" y1="370" x2="405" y2="425" stroke="#334155" stroke-width="1.5"/>
  <line x1="380" y1="398" x2="430" y2="398" stroke="#334155" stroke-width="1.5"/>
  <rect x="450" y="370" width="50" height="55" rx="4" fill="#f59e0b" opacity="0.7"/>
  <rect x="453" y="373" width="44" height="49" rx="2" fill="#fbbf24" opacity="0.5"/>

  <!-- Ground floor (entrance) -->
  <rect x="340" y="455" width="120" height="75" rx="4" fill="#6366f1"/>
  <!-- Door frame -->
  <rect x="344" y="459" width="112" height="71" rx="3" fill="#4f46e5"/>
  <!-- Door steps -->
  <rect x="330" y="525" width="140" height="8" rx="2" fill="#94a3b8"/>
  <rect x="320" y="530" width="160" height="6" rx="2" fill="#cbd5e1"/>
  <!-- Door handle -->
  <circle cx="396" cy="495" r="4" fill="#a5b4fc"/>
  <!-- Arch detail -->
  <path d="M344 465 Q400 440 456 465" stroke="#818cf8" stroke-width="2" fill="none"/>

  <!-- Side building left (smaller) -->
  <rect x="100" y="300" width="110" height="230" rx="4" fill="#cbd5e1" opacity="0.7"/>
  <rect x="115" y="320" width="35" height="40" rx="3" fill="#1e293b"/>
  <line x1="132" y1="320" x2="132" y2="360" stroke="#334155" stroke-width="1.5"/>
  <rect x="155" y="320" width="35" height="40" rx="3" fill="#6366f1" opacity="0.7"/>
  <rect x="115" y="380" width="35" height="40" rx="3" fill="#6366f1" opacity="0.6"/>
  <rect x="155" y="380" width="35" height="40" rx="3" fill="#1e293b"/>
  <line x1="172" y1="380" x2="172" y2="420" stroke="#334155" stroke-width="1.5"/>
  <!-- Side building roof detail -->
  <rect x="98" y="290" width="114" height="14" rx="3" fill="#94a3b8"/>

  <!-- Side building right (smaller) -->
  <rect x="590" y="280" width="110" height="250" rx="4" fill="#cbd5e1" opacity="0.7"/>
  <rect x="605" y="300" width="35" height="40" rx="3" fill="#6366f1" opacity="0.7"/>
  <rect x="645" y="300" width="35" height="40" rx="3" fill="#1e293b"/>
  <line x1="662" y1="300" x2="662" y2="340" stroke="#334155" stroke-width="1.5"/>
  <rect x="605" y="360" width="35" height="40" rx="3" fill="#1e293b"/>
  <line x1="622" y1="360" x2="622" y2="400" stroke="#334155" stroke-width="1.5"/>
  <rect x="645" y="360" width="35" height="40" rx="3" fill="#f59e0b" opacity="0.7"/>
  <rect x="588" y="270" width="114" height="14" rx="3" fill="#94a3b8"/>

  <!-- Lamp posts -->
  <rect x="145" y="480" width="5" height="52" rx="2" fill="#475569"/>
  <path d="M148 480 Q148 460 168 460" stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="168" cy="460" r="6" fill="#fbbf24" opacity="0.9"/>
  <ellipse cx="168" cy="464" rx="10" ry="5" fill="#fbbf24" opacity="0.15"/>

  <rect x="650" y="475" width="5" height="57" rx="2" fill="#475569"/>
  <path d="M653 475 Q653 455 633 455" stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="633" cy="455" r="6" fill="#fbbf24" opacity="0.9"/>
  <ellipse cx="633" cy="459" rx="10" ry="5" fill="#fbbf24" opacity="0.15"/>

  <!-- PG Sign on building -->
  <rect x="270" y="135" width="100" height="34" rx="8" fill="#6366f1"/>
  <text x="320" y="157" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="white">PG</text>

  <!-- Hostel sign -->
  <rect x="390" y="135" width="130" height="34" rx="8" fill="#8b5cf6"/>
  <text x="455" y="157" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="white">HOSTEL</text>

  <!-- People silhouettes -->
  <!-- Person 1 -->
  <circle cx="165" cy="508" r="9" fill="#475569"/>
  <rect x="159" y="517" width="12" height="18" rx="3" fill="#475569"/>
  <!-- Person 2 -->
  <circle cx="635" cy="505" r="9" fill="#475569"/>
  <rect x="629" y="514" width="12" height="18" rx="3" fill="#475569"/>

  <!-- Floating cards / amenity pills -->
  <g transform="translate(80, 120)">
    <rect width="100" height="28" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="50" y="19" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11" fill="#a5b4fc">WiFi Included</text>
  </g>
  <g transform="translate(620, 140)">
    <rect width="100" height="28" rx="14" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="50" y="19" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11" fill="#c4b5fd">Meals Incl.</text>
  </g>
  <g transform="translate(55, 380)">
    <rect width="90" height="28" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="45" y="19" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11" fill="#fbbf24">24/7 Access</text>
  </g>

  <!-- Moon (night atmosphere) -->
  <circle cx="700" cy="80" r="28" fill="#fef3c7" opacity="0.15"/>
  <circle cx="714" cy="70" r="22" fill="#1a1a2e"/>
</svg>
